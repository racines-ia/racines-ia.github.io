name: Construire l'APK de Tiya

on:
  push:
    branches: [main, tiya]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_BASE: '1.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Préparer le projet Flutter
        run: |
          flutter create --org co.cuervo --project-name tiya --platforms android ../tiya_build
          rsync -a --exclude '.git' --exclude '.github' ./ ../tiya_build/
          rm -rf ../tiya_build/test
          cd ../tiya_build
          python3 .ci/patch_gradle.py
          grep -n "minSdk\|signingConfig" android/app/build.gradle* || true

      - name: Analyser le code
        working-directory: ../tiya_build
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compiler l'APK
        working-directory: ../tiya_build
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=${VERSION_BASE}.${{ github.run_number }} \
            --build-number=${{ github.run_number }}
          mkdir -p $GITHUB_WORKSPACE/dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk $GITHUB_WORKSPACE/dist/Tiya.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk $GITHUB_WORKSPACE/dist/Tiya-armv7.apk
          ls -la $GITHUB_WORKSPACE/dist

      - uses: actions/upload-artifact@v4
        with:
          name: Tiya-apk
          path: dist/*.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_BASE }}.${{ github.run_number }}
          name: Tiya v${{ env.VERSION_BASE }}.${{ github.run_number }}
          body: |
            **Tiya.apk** : pour la plupart des téléphones (64 bits).
            **Tiya-armv7.apk** : seulement pour les téléphones anciens (32 bits).
          files: |
            dist/Tiya.apk
            dist/Tiya-armv7.apk
          make_latest: true
