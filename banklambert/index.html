<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050806">
<meta name="description" content="Bank Lambert : épargnez d'abord, empruntez le double. Seulement 10 % d'intérêt pour 2 semaines.">
<title>Bank Lambert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: rassurant et net, une banque de quartier moderne à Kinshasa
   IDEA: le carnet d'épargne qui débloque un crédit
   PICTURE: deux piles de pièces, l'épargne et le double qu'on peut emprunter
   COLOUR and TYPE: vert forêt dominant, safran pour l'accent, Sora + Figtree
   LAYOUT: colonne mobile de 440px, actions en bas, navigation à 4 onglets */
:root{color-scheme:light dark;
--bg:light-dark(#FFFFFF,#000000);--card:light-dark(#FFFFFF,#101210);--soft:light-dark(#F2F6F1,#1A1D1A);
--line:light-dark(#E2E8E1,#272B27);--ink:light-dark(#0E1A12,#F4F6F2);--mute:light-dark(#56635A,#A3ABA5);
--b2:#0B8A43;--on2:#FFFFFF;--lk:light-dark(#0B7A3B,#5FD68E);--pos:light-dark(#137044,#5CC596);
--deep:#06331C;--acc:#FFC928;--onacc:#1F1600;--err:light-dark(#B3261E,#FF8A80);
--sh:0 1px 2px rgba(0,0,0,.05),0 10px 28px rgba(10,40,28,.08);--e:cubic-bezier(.22,1,.36,1)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Figtree',system-ui,sans-serif;overflow-x:clip}
h1,h2,.num{font-family:'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:-.02em;margin:0}
h1{font-size:clamp(28px,8vw,36px);line-height:1.08;text-wrap:balance}
h2{font-size:20px}
p{margin:0}
button,input,select{font:inherit;color:inherit}
.app{max-width:440px;margin:0 auto;min-height:100dvh;position:relative}
.scr{padding:20px 20px 28px;display:flex;flex-direction:column;gap:18px;min-height:100dvh}
.scr.nav-pad{padding-bottom:104px}
.scr>*{animation:in .42s var(--e) both}
.scr>*:nth-child(2){animation-delay:50ms}.scr>*:nth-child(3){animation-delay:100ms}.scr>*:nth-child(4){animation-delay:150ms}.scr>*:nth-child(n+5){animation-delay:200ms}
.still .scr>*{animation:none}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:16px;border:0;background:var(--b2);color:var(--on2);font-weight:700;font-size:17px;cursor:pointer;transition:transform .16s var(--e),opacity .16s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.acc{background:var(--acc);color:var(--onacc)}
.btn.alt{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.on-deep .btn.alt{border-color:rgba(255,255,255,.3);color:#F3F5F2}
.btn.sm{height:48px;font-size:16px;border-radius:14px}
:focus-visible{outline:3px solid light-dark(#0B8A43,#5FD68E);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;min-height:44px}
.top b{font-size:17px}
.ib{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lead{font-size:17px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:12px}
.hero{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.06);background:radial-gradient(110% 80% at 105% -10%,rgba(255,201,40,.38),transparent 55%),radial-gradient(70% 60% at -10% 110%,rgba(92,197,150,.16),transparent 60%),var(--deep);color:#F3F5F2;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh)}
.hero small,.hero .m{color:#B9B9C4;font-size:14px}
.hero .big{font-size:clamp(30px,9vw,38px);font-weight:700;white-space:nowrap}
.acc-t{color:var(--acc)}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transform-origin:left;animation:grow .8s var(--e) both}
@keyframes grow{from{transform:scaleX(0)}}
.sp{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sp span:last-child{white-space:nowrap;font-weight:600}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.chip{height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap;transition:transform .16s var(--e),background .16s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed=true]{background:var(--b2);border-color:var(--b2);color:var(--on2)}
.op{height:78px;flex-direction:column;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;white-space:normal}
.op[aria-pressed=true]{background:var(--card);color:var(--ink);border-color:var(--b2);box-shadow:inset 0 0 0 1px var(--b2)}
.op i{width:32px;height:32px;border-radius:10px;color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700}
.lbl{font-size:14px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.field input,.field select{height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px;font-weight:400;width:100%}
.field input[type=file]{height:auto;padding:12px}
.pre{display:flex;gap:8px}.pre span{height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft);display:grid;place-items:center;font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--mute)}
.check input{width:22px;height:22px;margin:0;accent-color:var(--b2);flex:none}
.err{color:var(--err);font-size:14px;font-weight:600}
.note{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:14px;color:var(--mute)}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li b{font-weight:600;display:block}.li small{color:var(--mute);font-size:13px}
.li .v{font-weight:700;white-space:nowrap}.li .v.plus{color:var(--pos)}
.li{justify-content:flex-start}.li>div{flex:1}
.hic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--soft);flex:none;color:var(--mute)}.hic.d{color:var(--pos)}.hic.l{color:var(--lk)}
.promo{position:relative;overflow:hidden;border-radius:22px;background:#06331C;color:#fff;min-height:168px;display:flex;box-shadow:var(--sh)}
.promo img{position:absolute;right:0;top:0;height:100%;width:56%;object-fit:cover;object-position:center 12%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%)}
.promo>div{position:relative;padding:18px;width:64%;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.promo b{font:700 19px/1.15 'Plus Jakarta Sans',sans-serif}.promo p{font-size:13px;color:#C9C9D2}
.promo .tag{background:var(--acc);color:var(--onacc);font-weight:700;font-size:12px;padding:3px 9px;border-radius:999px}
.cardtop{display:flex;justify-content:space-between;align-items:center}.cardtop .logo{font-size:15px;color:#fff;gap:8px}.cardtop .logo i{width:26px;height:26px;border-radius:8px;color:var(--deep)}
.adm{font:700 12px 'Figtree',sans-serif;border:0;cursor:pointer;background:var(--b2);color:var(--on2);padding:4px 10px;border-radius:999px;letter-spacing:0}
.mask{font-size:13px;color:#B9B9C4;letter-spacing:.08em}
.empty{text-align:center;padding:28px 18px;color:var(--mute)}
input[type=range]{width:100%;accent-color:var(--b2);height:32px}
.link{background:none;border:0;color:var(--lk);font-weight:600;cursor:pointer;padding:6px 0;font-size:14px}
.fine{font-size:13px;color:var(--mute);text-align:center}
nav{position:fixed;bottom:0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--card) 88%,transparent)!important;left:50%;transform:translateX(-50%);width:min(440px,100%);height:76px;padding:8px 10px 12px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));z-index:5}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--mute);cursor:pointer}
nav button[aria-current=page]{color:var(--ink);font-weight:700}
nav button[aria-current=page] svg{box-sizing:content-box;padding:4px 15px;border-radius:999px;background:var(--b2);color:var(--on2)}
nav button svg{padding:4px 15px;box-sizing:content-box;transition:background .2s var(--e)}
/* accueil */
.welcome{background:var(--deep);color:#F3F5F2}
.welcome .lead{color:#C9D6CF}
.logo{display:flex;align-items:center;gap:10px;font:700 22px 'Plus Jakarta Sans',sans-serif}
.logo i{width:36px;height:36px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:var(--deep)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:end;padding:20px 18px 16px;border-radius:24px;background:rgba(255,255,255,.06);min-height:230px}
.col{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.pile{display:flex;flex-direction:column-reverse;width:70%}
.coin{height:16px;margin-top:-4px;border-radius:50%;background:#E3EFE7;box-shadow:inset 0 -4px 0 #93B5A4;animation:drop .45s var(--e) both}
.pile.gold .coin{background:var(--acc);box-shadow:inset 0 -4px 0 #B87818}
@keyframes drop{from{opacity:0;transform:translateY(-26px)}}
.col b{font:700 18px 'Plus Jakarta Sans',sans-serif;white-space:nowrap}.col span{font-size:13px;color:#C9D6CF}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:13px;color:#C9D6CF;text-align:center}
.steps b{display:block;font:700 15px 'Plus Jakarta Sans',sans-serif;color:var(--acc)}
.mt{margin-top:auto;display:flex;flex-direction:column;gap:10px}
/* présentation */
.onb{position:relative;min-height:100dvh;overflow:hidden;background:#2F2F33!important;--tint:light-dark(#DDF1E4,#11281C);--city:light-dark(#B9DEC8,#1B3B2B);background:var(--tint);transition:background .35s var(--e)}
.onb.t1{--tint:light-dark(#E5E3FA,#1B1A33);--city:light-dark(#C9C5F2,#2C2A52)}
.onb.t2{--tint:light-dark(#FCEFD8,#2A2112);--city:light-dark(#F3D7A4,#45361A)}
.stage{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-start;padding-top:58px;overflow:hidden}
.bar-top{position:absolute;top:14px;min-height:44px;left:20px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.bar-top .logo{font-size:18px;color:var(--ink)}.bar-top .logo i{width:30px;height:30px;border-radius:9px;color:var(--deep)}
.skip{height:44px;padding:0 12px;border:0;background:none;font-weight:600;font-size:15px;color:var(--ink);cursor:pointer}
.city{position:absolute;left:0;right:0;bottom:0;width:100%;height:82%;color:var(--city)}
.stage img{position:relative;flex:none;width:min(108%,calc((100dvh - 240px)*.86));max-width:none;height:auto;filter:drop-shadow(0 18px 24px rgba(10,40,28,.18));user-select:none}
.t1 .stage img{width:min(132%,calc((100dvh - 200px)*.92));margin-top:56px}
.stage img.photo{position:absolute;left:0;top:0;width:100%;height:calc(100% - 200px);max-width:none;margin:0;object-fit:cover;filter:none}
.stage::after{content:"";position:absolute;inset:0 0 auto;height:130px;background:linear-gradient(rgba(0,0,0,.5),transparent);z-index:1}
.onb .bar-top .logo,.onb .skip{color:#fff}
.city{display:none}
.pop{animation:pop .45s var(--e) both}
@keyframes pop{from{opacity:0;transform:translateX(var(--dx,0))}}
.sheetb{position:absolute;left:0;right:0;bottom:0;z-index:2;background:var(--card);border-radius:28px 28px 0 0;padding:20px 24px 28px;display:flex;flex-direction:column;gap:10px;text-align:center;box-shadow:0 12px 40px rgba(10,40,28,.18)}
.sheetb h1{font-size:clamp(26px,7.4vw,32px)}
.txt{animation:in .4s var(--e) both}.sheetb p.txt{animation-delay:60ms}
.dots{display:flex;justify-content:center;gap:2px}
.dots button{width:30px;height:30px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.dots button::after{content:"";width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .25s var(--e),background .25s}
.dots button[aria-current]::after{width:24px;background:var(--b2)}
/* présentation façon stories */
.onb2{position:relative;height:100dvh;min-height:600px;overflow:hidden;background:#2F2F33;color:#fff}
.onb2 .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,12,14,.55) 0,rgba(12,12,14,0) 18%,rgba(12,12,14,0) 38%,rgba(12,12,14,.82) 62%,#0C0C0E 100%)}
.bars{position:absolute;top:12px;left:16px;right:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;z-index:3}
.bars span{height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.bars i{display:block;height:100%;width:0;background:#fff}
.bars i.done{width:100%}.bars i.run{animation:fill 6s linear forwards}
@keyframes fill{to{width:100%}}
.hdr{position:absolute;top:22px;left:16px;right:8px;min-height:44px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.hdr .logo{font-size:18px;color:#fff}.hdr .logo i{width:30px;height:30px;border-radius:9px;color:var(--deep)}
.hdr .skip{color:#fff}
.tap{position:absolute;top:80px;height:calc(76% - 120px);border:0;background:none;z-index:2;cursor:pointer}
.tap.tl{left:0;width:35%}.tap.tr{right:0;width:65%}
.content{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:0 22px 26px;display:flex;flex-direction:column;gap:12px}
.content h1{font-size:clamp(32px,9.6vw,42px);line-height:1.04;color:#fff}
.content p{font-size:16px;color:#D9D9DE;max-width:34ch}
.kick{align-self:flex-start;padding:6px 12px;border-radius:999px;background:rgba(242,169,59,.18);color:var(--acc);font-weight:700;font-size:14px}
.badge{position:absolute;right:18px;top:-118px;width:104px;height:104px;border-radius:50%;background:var(--acc);color:var(--onacc);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(-10deg);box-shadow:0 10px 30px rgba(0,0,0,.35);animation:stamp .5s .15s var(--e) both}
.badge b{font:700 28px/1 'Plus Jakarta Sans',sans-serif}.badge span{font-size:11px;font-weight:700;line-height:1.2;margin-top:3px}
@keyframes stamp{from{opacity:0;transform:rotate(-30deg) scale(.6)}}
.acts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.lw{color:#fff;align-self:center}
@media(max-height:680px){.badge{width:84px;height:84px;top:-92px}.badge b{font-size:22px}.content h1{font-size:30px}}
.phw{position:absolute;left:50%;top:0;height:100%;min-width:100%;translate:-50% 0}
.onb2 .phw .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.onb2.lite{background:var(--bgc);color:#141417}
.lite .shade{background:linear-gradient(180deg,transparent 0,transparent 44%,color-mix(in srgb,var(--bgc) 85%,transparent) 60%,var(--bgc) 72%)}
.lite .bars span{background:rgba(20,20,23,.18)}.lite .bars i{background:#141417}
.lite .hdr .logo,.lite .hdr .skip{color:#141417}.lite .hdr .logo i{background:#141417;color:var(--acc)}
.lite .content h1{color:#141417}.lite .content p{color:rgba(20,20,23,.82)}
.lite .kick{background:#141417;color:#fff}
.lite .badge{background:#141417;color:var(--acc)}.lite.s0 .badge{display:none}
.lite .btn.acc{background:#141417;color:#fff}.lite .lw{color:#141417}
.scrn{position:absolute;left:57.7%;top:51.3%;width:17.4%;height:30.1%;transform:translate(-50%,-50%) rotate(-5deg);border-radius:12%/5.5%;background:#141417;color:#fff;font-size:clamp(10px,1.75dvh,16px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35em;text-align:center;padding:.6em;animation:fade .6s .35s both}
.scrn .l{font:700 .95em 'Plus Jakarta Sans',sans-serif;color:#fff;margin-bottom:.3em}
.scrn b{font:700 2.9em/1 'Plus Jakarta Sans',sans-serif;color:var(--acc);white-space:nowrap}
.scrn small{font-size:.82em;line-height:1.25;color:#D0D0D8}
.scrn .pill{margin-top:.5em;font-size:.72em;font-weight:700;line-height:1.2;background:var(--acc);color:#1E1405;padding:.35em .7em;border-radius:99px}
.lite.s0 .phw{top:-11%}.lite.s0 .shade{background:linear-gradient(180deg,transparent 0,transparent 57%,color-mix(in srgb,var(--bgc) 85%,transparent) 66%,var(--bgc) 75%)}
.lite.s1 .phw{top:-5%}
/* marque Bank Lambert */
.lgm{width:30px;height:30px;border-radius:9px;background:#0B8A43!important;display:grid;place-items:center;flex:none}
.lgm svg{width:19px;height:22px;fill:#FFC928}
.cardtop .lgm{width:26px;height:26px;border-radius:8px}.cardtop .lgm svg{width:16px;height:18px}
.intro{position:relative;height:100dvh;min-height:620px;overflow:hidden;background:#0B8A43;color:#FFC928}
.iph{position:absolute;left:0;top:0;width:100%;height:76%;object-fit:cover}
.hint{font-size:13px!important;color:rgba(255,255,255,.7)!important;text-align:center;max-width:none!important;margin:0}
.itop{position:absolute;inset:0 0 auto;height:150px;background:linear-gradient(rgba(0,0,0,.5),transparent);z-index:1}
.intro .hdr .logo{color:#fff}
.panel{position:absolute;left:0;right:0;bottom:0;z-index:3;background:#0B8A43;border-radius:30px 30px 0 0;padding:26px 22px 22px;display:flex;flex-direction:column;gap:12px}
.wmk{position:absolute;right:-34px;bottom:-44px;width:220px;height:248px;fill:#FFC928;opacity:.07;pointer-events:none}
.panel h1{font-size:clamp(26px,7.4vw,32px);color:#FFC928;line-height:1.06;max-width:12ch}
.panel p{color:rgba(255,255,255,.86);font-size:16px;max-width:34ch}
.kick2{align-self:flex-start;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);color:#FFC928;font-weight:700;font-size:14px}
.badge2{position:absolute;right:18px;top:-64px;width:106px;height:106px;border-radius:50%;background:#FFC928;color:#06331C;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(-10deg);box-shadow:0 12px 30px rgba(0,0,0,.3);animation:stamp .5s .15s var(--e) both}
.badge2 b{font:700 28px/1 'Plus Jakarta Sans',sans-serif}.badge2 span{font-size:11px;font-weight:700;line-height:1.2;margin-top:3px}
.btn.cream{background:#FFC928;color:#06331C}
.intro .lw{color:#FFC928}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--sh)}
.stat small{color:var(--mute);font-size:13px}.stat b{font-size:clamp(18px,5.4vw,22px);white-space:nowrap}
/* style tableau de bord */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1 em{font-style:normal;color:var(--lk)}
.hero{border-radius:28px}.card,.list{border-radius:24px}
.hhead{display:flex;align-items:center;gap:12px}
.av{width:48px;height:48px;border-radius:16px;border:0;background:var(--b2);color:var(--on2);font:700 19px 'Plus Jakarta Sans',sans-serif;cursor:pointer;flex:none}
.welcome2 .hi{font-size:16px;color:#CDEBD8;line-height:1.3}.welcome2 .hi b{font:700 26px/1.15 'Plus Jakarta Sans',sans-serif;color:#fff}

.tries{display:flex;align-items:center;gap:8px}.tok{width:14px;height:14px;border-radius:50%;background:var(--line)}.tok.on{background:#FFC928;box-shadow:0 0 0 4px color-mix(in srgb,#FFC928 35%,transparent)}

.wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 16px 30px rgba(6,51,28,.3))}
#wg{transform-box:view-box;transform-origin:0 0}
.spinning #wg{transition:transform 5.2s cubic-bezier(.12,.7,.08,1)}
.bulb{fill:#FFF6D5;animation:blink 1s steps(1) infinite;animation-delay:calc(var(--k)*.5s)}

nav{height:80px;border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(6,51,28,.08);grid-template-columns:repeat(5,minmax(0,1fr))!important;border-top:0!important}

@keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),calc(var(--y) + 380px)) rotate(var(--r))}}
nav.n-pilule{display:flex!important;left:50%;bottom:12px;width:min(416px,calc(100% - 24px));height:66px;border-radius:999px;background:var(--deep)!important;color:#CDEBD8;padding:8px;gap:4px;box-shadow:0 14px 30px rgba(6,51,28,.35)}

nav.n-pilule button.mid svg{width:22px;height:22px;padding:4px 0!important;margin-top:0;border:0;box-shadow:none;background:none!important;color:inherit!important}

nav.n-ligne button{position:relative}
nav.n-ligne button[aria-current=page]{color:var(--lk)}
nav.n-ligne button[aria-current=page]::before{content:"";position:absolute;top:-8px;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--b2)}
nav.n-ligne button.mid svg{width:22px;height:22px;padding:4px 0!important;margin-top:0;border:0;box-shadow:none;background:none!important;color:inherit!important}
nav.n-ligne button.mid .sr,nav.n-pilule button.mid .sr{position:static;width:auto;height:auto;clip:auto;overflow:visible}
/* animation d'ouverture */
.splash{position:fixed;inset:0;z-index:50;background:radial-gradient(90% 60% at 50% 42%,#14A653,#0B8A43 58%,#055A2B);display:grid;place-items:center;color:#FFC928;cursor:pointer;transition:opacity .55s var(--e),transform .55s var(--e)}
.splash.out{opacity:0;transform:scale(1.06)}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:20px}
.splash .big{width:118px;height:133px;fill:#FFC928;overflow:visible}
.big .lr{transform-box:fill-box;transform-origin:center;animation:ring .8s var(--e) both}
@keyframes ring{from{opacity:0;transform:scale(.35) rotate(-25deg)}}
.big .lp{transform-box:fill-box;transform-origin:50% 100%;animation:leaf .55s var(--e) both;animation-delay:calc(.5s + var(--i)*90ms)}
@keyframes leaf{from{opacity:0;transform:scale(0)}}
.wm{display:flex;gap:.28em;font:700 34px/1.1 'Plus Jakarta Sans',sans-serif;letter-spacing:-.02em;overflow:hidden;padding-bottom:2px}
.wm span{display:inline-block;animation:rise .6s var(--e) both}.wm span:first-child{animation-delay:1.1s}.wm span:last-child{animation-delay:1.22s}
@keyframes rise{from{opacity:0;transform:translateY(105%)}}
.tg{margin:0;font-size:15px;color:rgba(255,255,255,.8);animation:fade .6s 1.55s both}
.glow{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(rgba(255,255,255,.22),transparent 65%);animation:pulse 2.4s .4s var(--e) both}
@keyframes pulse{from{opacity:0;transform:scale(.4)}50%{opacity:1}to{opacity:0;transform:scale(1.5)}}
/* fenêtre de traitement */
.ov{position:fixed;inset:0;background:rgba(8,8,10,.6);display:grid;place-items:center;padding:20px;z-index:10;animation:fade .25s var(--e)}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--card);border-radius:24px;padding:28px 22px;width:min(380px,100%);text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;animation:in .35s var(--e)}
.spin{width:56px;height:56px;border-radius:50%;border:5px solid var(--soft);border-top-color:var(--b2);animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.ok{width:76px;height:76px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--b2)}
.ok path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .1s var(--e) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.ok path{stroke-dashoffset:0}}

/* ===== thème sombre et vert lumineux ===== */
:root{--bg:light-dark(#F4F7F4,#050806);--card:light-dark(#FFFFFF,#0D130F);--soft:light-dark(#EDF3EE,#141B16);--line:light-dark(#DFE7E1,#1E2822);--ink:light-dark(#0A140D,#F1F6F2);--mute:light-dark(#5A675E,#8E9B92);--b2:light-dark(#127A3E,#8CF56A);--on2:light-dark(#FFFFFF,#04140A);--lk:light-dark(#127A3E,#8CF56A);--pos:light-dark(#127A3E,#8CF56A);--acc:#8CF56A;--onacc:#04140A;--deep:#06180E}
h1,h2,.num{font-family:'Plus Jakarta Sans',system-ui,sans-serif}
h1 em{color:var(--lk)}
.btn{background:var(--b2)!important;color:var(--on2)!important;box-shadow:0 10px 28px color-mix(in srgb,var(--b2) 28%,transparent)}

.btn:disabled{box-shadow:none}.btn.acc{color:var(--on2)!important}
.card,.list{background:var(--card);border:1px solid var(--line);box-shadow:none}
.hero,.gboard{background:radial-gradient(90% 70% at 100% 0%,rgba(140,245,106,.22),transparent 60%),linear-gradient(160deg,#123D25,#07150D 75%)!important;border:1px solid rgba(140,245,106,.14)!important;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.acc-t{color:#8CF56A}.hero .gift{background:rgba(140,245,106,.14);color:#8CF56A}
.lgm{background:linear-gradient(135deg,#1A5C34,#0B2615)!important;box-shadow:inset 0 0 0 1px rgba(140,245,106,.35)}.lgm svg{fill:#8CF56A}
.opt[aria-pressed=true]{background:color-mix(in srgb,var(--b2) 12%,var(--card))}
.hic2{background:color-mix(in srgb,var(--b2) 14%,transparent);color:var(--lk);border-radius:14px}
.congrats{background:linear-gradient(135deg,#D6FFC7,#8CF56A 55%,#3DBB5A);color:#04140A;box-shadow:0 0 40px rgba(140,245,106,.3)}

function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),img=new Image();img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('Photo illisible.')),'image/jpeg',.82)};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Photo illisible. Essayez une autre photo.'))};img.src=u})}

if(ui.err){render(true);return}
ui.busy=true;render(true);
try{if(!UID){const{data,error}=await sb.auth.signUp({email:mailOf(f.phone),password:pin});if(error)throw error;if(!data.session){const r2=await sb.auth.signInWithPassword({email:mailOf(f.phone),password:pin});if(r2.error)throw r2.error;UID=r2.data.user.id}else UID=data.user.id}
await rpc('bl_register',{p_name:f.name,p_phone:'+243 '+f.phone.replace(/(\d{2})(\d{3})(\d{4})/,'$1 $2 $3'),p_commune:f.commune,p_job:f.job});await load();
ui.busy=false;ui.onboard=true;ui.screen='deposit';ui.err='';render();scrollTo(0,0)}catch(er){ui.busy=false;ui.err=errMsg(er);render(true)}});
render();
(()=>{const rm=matchMedia('(prefers-reduced-motion: reduce)').matches,d=document.createElement('div');d.className='splash';d.setAttribute('role','img');d.setAttribute('aria-label','Bank Lambert');
d.innerHTML=`<div class="glow"></div><div class="sp-in">${LOGO('big')}<div class="wm"><span>Bank</span><span>Lambert</span></div><p class="tg">Épargnez. Empruntez. Grandissez.</p></div>`;document.body.appendChild(d);
const end=()=>{if(d.dataset.out)return;d.dataset.out=1;d.classList.add('out');setTimeout(()=>d.remove(),600)};d.onclick=end;setTimeout(end,rm?800:3000)})();
(async()=>{try{await loadCfg()}catch(e){}
try{const{data:{session}}=await sb.auth.getSession();if(session){UID=session.user.id;const ok=await load();if(ok){if(ui.screen==='welcome'){ui.screen='home';ui.shown=0}}else if(ui.screen==='welcome'){ui.screen='signup'}}}catch(e){}
render(true)})();
setInterval(()=>{if(UID&&!ui.spinning&&!ui.busy&&document.visibilityState==='visible'&&['home','jeu','history'].includes(ui.screen)&&!document.querySelector('.ov'))load().then(()=>render(true)).catch(()=>{})},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&UID&&!ui.spinning&&['home','jeu','history'].includes(ui.screen))load().then(()=>render(true)).catch(()=>{})});
}
</script>
</body>
